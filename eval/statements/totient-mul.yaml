# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: totient-mul
title: The totient function is multiplicative
informal: For two coprime natural numbers m and n, the totient of mn is the product of the totients of m and n.
reviewed:
  repo: mathlib
  commit: 56a005855ea17e0b0958f73ec801ae140b0a1679
  path: Mathlib/Data/Nat/Totient.lean
  decl: Nat.totient_mul
  lean: |
    theorem totient_mul {m n : ℕ} (h : m.Coprime n) : φ (m * n) = φ m * φ n
checks: [build, equiv-reference]
wrong:
  - id: totient-mul-not-coprime
    trap: missing-condition
    reason: The totient of 4 is 2 but the product of the totients of 2 and 2 is 1, so without the coprime condition the statement is false.
    lean: |
      theorem totient_mul {m n : ℕ} : φ (m * n) = φ m * φ n
