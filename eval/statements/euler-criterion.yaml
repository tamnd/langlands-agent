# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: euler-criterion
title: The criterion of Euler
informal: For a prime p and a nonzero element a of Z/pZ, a is a square if and only if a^(p/2) = 1, where p/2 is rounded down.
