# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: sato-tate
title: The Sato-Tate conjecture
informal: For an elliptic curve E over the rationals without complex multiplication, the Sato-Tate angles θ_p are equidistributed in [0, π] for the measure (2/π) sin^2 θ dθ.
reviewed:
  repo: langlands-lean
  commit: 7154bc1a0d3c81483d82ffdf25957e123617f1aa
  path: Langlands/Statements/Modularity.lean
  decl: Langlands.SatoTate
  lean: |
    def SatoTate : Prop :=
      ∀ (E : WeierstrassCurve ℚ) [E.IsElliptic], ¬ HasCMOverQ E →
        ∀ α β : ℝ, 0 ≤ α → α ≤ β → β ≤ π →
          Tendsto
            (fun x : ℕ =>
              (Nat.card {p : ℕ // p.Prime ∧ p ≤ x ∧ satoTateAngle E p ∈ Set.Icc α β} : ℝ) /
                Nat.card {p : ℕ // p.Prime ∧ p ≤ x})
            atTop (𝓝 ((2 / π) * ∫ θ in α..β, Real.sin θ ^ 2))
checks: [build, equiv-reference]
wrong:
  - id: sato-tate-uniform
    trap: wrong-object
    reason: It uses the uniform measure dθ/π in place of the Sato-Tate measure (2/π) sin^2 θ dθ.
    lean: |
      def SatoTate : Prop :=
        ∀ (E : WeierstrassCurve ℚ) [E.IsElliptic], ¬ HasCMOverQ E →
          ∀ α β : ℝ, 0 ≤ α → α ≤ β → β ≤ π →
            Tendsto
              (fun x : ℕ =>
                (Nat.card {p : ℕ // p.Prime ∧ p ≤ x ∧ satoTateAngle E p ∈ Set.Icc α β} : ℝ) /
                  Nat.card {p : ℕ // p.Prime ∧ p ≤ x})
              atTop (𝓝 ((β - α) / π))
    ref:
      repo: langlands-lean
      commit: 7154bc1a0d3c81483d82ffdf25957e123617f1aa
