# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: kronecker-weber
title: The Kronecker-Weber theorem
informal: Each finite abelian extension of the rational numbers is contained in a cyclotomic field.
reviewed:
  repo: langlands-lean
  commit: 7154bc1a0d3c81483d82ffdf25957e123617f1aa
  path: Langlands/Statements/ClassField.lean
  decl: Langlands.KroneckerWeber
  lean: |
    def KroneckerWeber : Prop :=
      ∀ L : IntermediateField ℚ (AlgebraicClosure ℚ), FiniteDimensional ℚ L → IsAbelianGalois ℚ L →
        ∃ (n : ℕ) (ζ : AlgebraicClosure ℚ), 0 < n ∧ IsPrimitiveRoot ζ n ∧
          L ≤ IntermediateField.adjoin ℚ {ζ}
checks: [build, equiv-reference]
wrong:
  - id: kronecker-weber-not-abelian
    trap: missing-condition
    reason: The field generated by a cube root of 2 is a finite extension of the rationals that is not in a cyclotomic field, so without the abelian condition the statement is false.
    lean: |
      def KroneckerWeber : Prop :=
        ∀ L : IntermediateField ℚ (AlgebraicClosure ℚ), FiniteDimensional ℚ L →
          ∃ (n : ℕ) (ζ : AlgebraicClosure ℚ), 0 < n ∧ IsPrimitiveRoot ζ n ∧
            L ≤ IntermediateField.adjoin ℚ {ζ}
  - id: kronecker-weber-number-field
    trap: field-class
    reason: "Over a number field the statement is false: the Hilbert class field of Q(sqrt(-23)) is abelian over Q(sqrt(-23)) but not over the rationals, so it is not in a cyclotomic extension."
    lean: |
      def KroneckerWeber : Prop :=
        ∀ (K : Type) [Field K] [NumberField K] (L : IntermediateField K (AlgebraicClosure K)),
          FiniteDimensional K L → IsAbelianGalois K L →
            ∃ (n : ℕ) (ζ : AlgebraicClosure K), 0 < n ∧ IsPrimitiveRoot ζ n ∧
              L ≤ IntermediateField.adjoin K {ζ}
