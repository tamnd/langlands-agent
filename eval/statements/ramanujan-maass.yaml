# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: ramanujan-maass
title: The Ramanujan conjecture for Maass forms
informal: For a nonzero Maass cusp form of level N and character χ, each eigenvalue c of the normalized Hecke operator T_p, for a prime p that does not divide N, has |c| at most 2.
reviewed:
  repo: langlands-lean
  commit: 7154bc1a0d3c81483d82ffdf25957e123617f1aa
  path: Langlands/Statements/Maass.lean
  decl: Langlands.RamanujanMaass
  lean: |
    def RamanujanMaass : Prop :=
      ∀ (N : ℕ) (χ : DirichletCharacter ℂ N) (f : ℍ → ℂ) (ev : ℝ), 0 < N → f ≠ 0 →
        IsMaassCuspForm N χ f ev →
        ∀ (p : ℕ) (c : ℂ), p.Prime → ¬ p ∣ N → heckeOperator χ p f = c • f → ‖c‖ ≤ 2
checks: [build, equiv-reference]
wrong:
  - id: ramanujan-maass-not-cuspidal
    trap: missing-condition
    reason: Without the cuspidal condition the constant function 1 of level 1 is allowed, and its eigenvalue p^(1/2) + p^(-1/2) for T_p is larger than 2.
    lean: |
      def RamanujanMaass : Prop :=
        ∀ (N : ℕ) (χ : DirichletCharacter ℂ N) (f : ℍ → ℂ) (ev : ℝ), 0 < N → f ≠ 0 →
          IsL2Eigenfunction (Gamma1 N) f ev →
          (∀ γ ∈ Gamma0 N, ∀ τ : ℍ,
            f (γ • τ) = χ (((γ : Matrix (Fin 2) (Fin 2) ℤ) 1 1 : ℤ) : ZMod N) * f τ) →
          ∀ (p : ℕ) (c : ℂ), p.Prime → ¬ p ∣ N → heckeOperator χ p f = c • f → ‖c‖ ≤ 2
    ref:
      repo: langlands-lean
      commit: 7154bc1a0d3c81483d82ffdf25957e123617f1aa
      path: Langlands/Fidelity/Maass.lean
      decl: Langlands.Fidelity.two_lt_heckeEigenvalue_one
