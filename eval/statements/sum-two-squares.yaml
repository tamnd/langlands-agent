# A statement of spec 10.9, written by hand. A wrong statement is elaborated in place of the reviewed declaration, in its file, so it states each binder that it needs.
id: sum-two-squares
title: Primes that are sums of two squares
informal: A prime p that is not 3 modulo 4 is a sum of two squares.
reviewed:
  repo: mathlib
  commit: 56a005855ea17e0b0958f73ec801ae140b0a1679
  path: Mathlib/NumberTheory/SumTwoSquares.lean
  decl: Nat.Prime.sq_add_sq
  lean: |
    theorem Nat.Prime.sq_add_sq {p : ℕ} [Fact p.Prime] (hp : p % 4 ≠ 3) :
        ∃ a b : ℕ, a ^ 2 + b ^ 2 = p
checks: [build, equiv-reference]
wrong:
  - id: sum-two-squares-mod-four
    trap: constant
    reason: The prime 3 is not 1 modulo 4 and is not a sum of two squares, so the statement is false.
    lean: |
      theorem Nat.Prime.sq_add_sq {p : ℕ} [Fact p.Prime] (hp : p % 4 ≠ 1) :
          ∃ a b : ℕ, a ^ 2 + b ^ 2 = p
